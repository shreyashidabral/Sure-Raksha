name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /health
        run: |
          URL="https://sure-raksha.onrender.com/health"
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 90 "$URL" || true)
            echo "attempt $attempt -> HTTP $code: $(cat /tmp/body 2>/dev/null)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Site did not answer 200 after 3 attempts"
          exit 1
